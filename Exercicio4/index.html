<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabuada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="caixa">
        <h1>Tabuada</h1>

        <form method="post" action="processa.php">
            <label for="numero">Informe o número</label>
            <input type="number" step="any" id="numero" name="numero" required autofocus>

            <div class="botoes">
                <button type="submit" class="calcular">Calcular</button>
                <button type="reset" class="limpar">Limpar</button>
            </div>
        </form>
    </div>
</body>
</html>
